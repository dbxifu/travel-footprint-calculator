# Orchestrate docker containers to host an instance of the project.
# You *could* use this for development.  Don't.
# You *could* use this for production.  Don't.

services:

  # The actual Flask application
  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - "./var:/app/var"
    hostname: travel_footprint_calculator_app
    ports:
      - "80:80"
    environment:
      STATIC_PATH: /app/flaskr/static
      #ENV: production

  # The CRON triggers the computation runs every three minutes.
  # FIXME: use another docker image, this one appends multiple times to the CRON schedule file
  scheduler:
    image: jsonfry/curl-cron
    restart: unless-stopped
    environment:
      OPTIONS: "http://travel_footprint_calculator_app/compute"
      CRON_SCHEDULE: "*/3 * * * *"
